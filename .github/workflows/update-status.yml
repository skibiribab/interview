name: Repo status

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify status listener
        run: gh api repos/skibiribab/control-plane/dispatches -f event_type=repo-status
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
