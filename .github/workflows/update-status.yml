name: Repo status

# Dormant: manual only. Fire the automation listener via repository_dispatch
# when re-enabled.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify status listener
        run: gh api repos/umbanda-oss/automation/dispatches -f event_type=repo-status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_REPO_WRITE }}
