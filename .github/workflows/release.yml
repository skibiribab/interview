name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: docker build --target resume -t interview-resume -f .github/docker/Dockerfile .
      - run: docker run --name resume-build interview-resume
      - name: Copy PDFs from container
        run: |
          mkdir -p artifacts
          docker cp resume-build:/workspace/resume/. /tmp/resume-out/
          docker rm resume-build
          shopt -s nullglob
          pdfs=(/tmp/resume-out/*.pdf)
          if [[ ${#pdfs[@]} -eq 0 ]]; then
            echo "No PDFs produced under /workspace/resume/" >&2
            ls -la /tmp/resume-out/ >&2 || true
            exit 1
          fi
          cp "${pdfs[@]}" artifacts/
          ls -la artifacts/

      - name: Publish tag
        id: tag
        run: |
          TAG="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: artifacts/*.pdf
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
